[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openproject-ce-mcp-server"
version = "0.1.0"
description = "Independent MCP server for OpenProject Community Edition, with remote HTTP and local stdio transports."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
keywords = ["openproject", "mcp", "model-context-protocol", "llm", "project-management"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Office/Business :: Scheduling",
]
dependencies = [
  # httpx stays an explicit direct dependency: mcp>=2 pulls in httpx2 as its
  # own transport, but never httpx itself. httpx/httpx2 objects are not
  # interchangeable -- this project doesn't pass either across the SDK
  # boundary, so the two coexist without conflict, but don't hand an
  # httpx.Response (or similar) to any mcp-SDK-facing interface.
  "httpx>=0.27,<1",
  # >=2 (not >=1.13): the code imports mcp.server.mcpserver exclusively,
  # which does not exist before 2.0.0 -- a caller could otherwise install a
  # 1.x version that fails to import at all.
  "mcp>=2,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7.1,<8",
]
measure = [
  "tiktoken>=0.8,<1",
]
budget-comparison = [
    "psycopg[binary,pool]>=3.2,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7.1,<8",
  "ruff>=0.15.9",
  "mypy>=1.14,<3",
  "psycopg[binary,pool]>=3.2,<4",
]

[project.scripts]
openproject-ce-mcp-server = "openproject_ce_mcp_server.server:main"
openproject-ce-mcp-server-setup = "openproject_ce_mcp_server.setup_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openproject_ce_mcp_server"]

# Keep the source distribution focused on what a user needs to build, install,
# configure, and verify the package. Dev-only trees (docker/, tools/api-check/,
# .github/) are intentionally omitted; they live in the git repository, not in
# the built source distribution.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
    "/configure_mcp.py",
  "/.mcp.json.example",
  "/.env.example",
  "/scripts/configure_codex.py",
  "/README.md",
  "/CHANGELOG.md",
  "/SECURITY.md",
  "/CONTRIBUTING.md",
  "/CODE_OF_CONDUCT.md",
  "/LICENSE.md",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not integration'"
markers = [
    "integration: tests against a live OpenProject instance (requires env vars)",
]

[tool.coverage.run]
source = ["src/openproject_ce_mcp_server"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = [
  "E501",   # line too long — handled by the formatter
  "SIM108", # ternary instead of if/else — often less readable
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["SIM"]  # test code may be more verbose

[tool.mypy]
python_version = "3.11"
files = ["src/openproject_ce_mcp_server"]

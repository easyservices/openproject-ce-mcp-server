name: GitHub Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag is an exact plain SemVer
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Verify tag matches pyproject.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag v$tag_version does not match pyproject.toml version $pkg_version" >&2
            exit 1
          fi

      - name: Build source distribution and wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Extract this version's CHANGELOG section
        run: |
          awk -v ver="${GITHUB_REF_NAME#v}" '
            /^## \[/ { if (found) exit; if ($0 ~ "^## \\[" ver "\\]") { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for ${GITHUB_REF_NAME#v}" >&2
            exit 1
          fi

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish Docker image to GitHub Container Registry
        env:
          IMAGE: ghcr.io/easyservices/openproject-ce-mcp-server
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          docker buildx build \
            --platform linux/amd64 \
            --tag "$IMAGE:$version" \
            --tag "$IMAGE:latest" \
            --push \
            .

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS
